[project]
name = "dramaloop"
version = "0.1.0"
description = "CLI-first short-drama story generation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.57.1",
  "fastapi>=0.115.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.1",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "mypy>=1.16.0",
]

[project.scripts]
dramaloop = "dramaloop.main:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
